[package]
name = "sfxrecord"
version = "0.1.0"
edition = "2024"
description = "Record sound effects, trim clips, and manage a clip library"
authors = ["SFX Record"]

[dependencies]
chrono = "0.4.45"
cpal = "0.18.2"
eframe = { version = "0.35.0", default-features = true }
flacenc = "0.5.1"
hound = "3.5.1"
png = "0.17.16"
rodio = "0.23.0"
rfd = "0.15.4"

[build-dependencies]
ico = "0.4.0"
image = { version = "0.25.9", default-features = false, features = ["png"] }
winres = "0.1.12"

[profile.release]
lto = false
codegen-units = 16
strip = true
